name: Publish Rust Crates

on:
  push:
    tags:
      - "rs-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - name: Validate release tag
        id: release
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/tags/rs-v*) ;;
            *)
              echo "publish-rust.yml only publishes from rs-v* tags" >&2
              exit 1
              ;;
          esac

          TAG_VERSION="${GITHUB_REF#refs/tags/rs-v}"
          WORKSPACE_VERSION="$(
            awk '
              /^\[workspace.package\]/ { in_workspace = 1; next }
              /^\[/ && in_workspace { exit }
              in_workspace && /^version = / { gsub(/"/, "", $3); print $3; exit }
            ' Cargo.toml
          )"

          if [ "${TAG_VERSION}" != "${WORKSPACE_VERSION}" ]; then
            echo "tag version ${TAG_VERSION} does not match workspace version ${WORKSPACE_VERSION}" >&2
            exit 1
          fi

          echo "version=${WORKSPACE_VERSION}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - name: Publish crates in dependency order
        run: bash scripts/publish-rust-crates.sh "${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
